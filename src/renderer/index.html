<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <title>DeepSeek Harness Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="window-drag-region" aria-hidden="true"></div>
    <main class="surface">
      <section class="splash" aria-live="polite">
        <img id="splash-mark" class="splash-mark" src="./assets/deepseek-harness-mark.svg" alt="DeepSeek Harness" />
        <section id="status-card" class="status-card" hidden>
          <h1 id="title">Harness 未能启动</h1>
          <p id="message">本地运行时没有在预期时间内就绪。</p>
          <div class="actions">
            <button id="retry" type="button">重新启动</button>
            <button id="copy" class="secondary" type="button">复制诊断信息</button>
          </div>
        </section>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
